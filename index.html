<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> Daily Sheet</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f5f1;margin:0;padding:15px;color:#172017}.wrap{max-width:740px;margin:auto;background:white;padding:18px;border-radius:10px;box-shadow:0 2px 15px #0001}h1{text-align:center;font-size:25px;margin:10px 0 20px}h2{background:#a9cd91;text-align:center;padding:12px;margin:24px 0 0;border:2px solid #263826;border-bottom:0;font-size:18px}.date{display:grid;grid-template-columns:1fr 1fr;gap:10px}.date label{background:#a9cd91;padding:9px;border:1px solid #263826;font-weight:bold}.date input{display:block;width:100%;margin-top:6px;padding:9px;font-size:16px;border:1px solid #aaa;background:white}table{width:100%;border-collapse:collapse}td{border:2px solid #263826;padding:0}td:first-child{width:60%;background:#fff1c9;padding:9px 8px}td:last-child{width:40%}td input{width:100%;padding:10px 8px;text-align:right;border:0;font-size:17px;background:white}tr.subtotal td{background:#e6f0d9;font-weight:bold}tr.total td:first-child{background:#a9cd91;font-weight:bold}.final td{border-top-width:3px}.final output{font-weight:800}output{display:block;text-align:right;padding:10px 8px;font-size:17px;font-weight:bold}.short{color:#ad2525}.over{color:#176b35}.good{color:#176b35}.state-label{font-size:12px;font-weight:800;letter-spacing:.03em;display:block;margin-top:2px}.amount-line{display:block}.group td{background:#f5df9c!important;font-weight:bold}.summary{margin-top:24px}.summary td:first-child{background:#a9cd91;font-weight:bold}textarea{width:100%;min-height:80px;padding:10px;font-size:16px}button{border:0;border-radius:7px;padding:12px 18px;background:#2e6c38;color:white;font-size:16px;cursor:pointer}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.secondary{background:#555}.report-view{display:none;margin-top:24px}.report-view.active{display:block}.report-view h2{margin-top:16px}.report-view .report-subtitle{font-size:13px;color:#555;margin:7px 0 12px}.report-view td:first-child{background:#fff1c9}.report-view tr.total td:first-child{background:#a9cd91}small{display:block;color:#555;margin-top:12px}@media(max-width:440px){.wrap{padding:10px}td:first-child{font-size:14px}h2{font-size:16px}}@page{size:auto;margin:0}@media print{html,body{margin:0!important;padding:0!important;background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{width:100%;max-width:none;padding:11mm 12mm!important;margin:0!important;border-radius:0;box-shadow:none}h1{margin:0 0 12px;font-size:21px}h2{padding:7px;margin-top:12px;font-size:16px}td:first-child{padding:5px 7px}td input{padding:5px 7px;font-size:14px}output{padding:5px 7px;font-size:14px}.date label{padding:5px}.date input{padding:5px}.summary{margin-top:14px}tr{break-inside:avoid;page-break-inside:avoid}thead,tbody{break-inside:auto}.summary{break-inside:avoid;page-break-inside:avoid} .group{break-after:avoid;page-break-after:avoid}h2{break-after:avoid;page-break-after:avoid}textarea{min-height:55px}button,small,.actions{display:none!important}input{color:black!important}}</style></head><body><main class="wrap"><h1>Daily Sheet</h1><div class="date"><label>Date<input type="date" id="date"></label><label>Day<input id="day" readonly></label></div><h2>SECTION A</h2><table id="a"></table><h2>SECTION B</h2><table id="b"></table><table class="summary"><tr><td>Total Daily Sales</td><td><output id="sales">$0.00</output></td></tr><tr><td>OVER / SHORT (C)</td><td><output id="difference">$0.00</output></td></tr><tr><td>Game Money Added Extra</td><td><input id="gameextra" type="number" inputmode="decimal" step="0.01" placeholder="0.00" aria-label="Game Money Added Extra"></td></tr><tr><td>People Tabs</td><td><input id="peopletabs" type="number" inputmode="decimal" step="0.01" placeholder="0.00" aria-label="People Tabs"></td></tr><tr><td>Money Taken From Back</td><td><input id="backtaken" type="number" inputmode="decimal" step="0.01" placeholder="0.00" aria-label="Money Taken From Back"></td></tr><tr><td>Money Added to Back</td><td><input id="backadded" type="number" inputmode="decimal" step="0.01" placeholder="0.00" aria-label="Money Added to Back"></td></tr><tr><td>Other Money Owe</td><td><input id="otherowe" type="number" inputmode="decimal" step="0.01" placeholder="0.00" aria-label="Other Money Owe"></td></tr><tr class="total final"><td>FINAL OVER / SHORT</td><td><output id="finaldifference">$0.00</output></td></tr></table><p><strong><u>Notes:</u></strong></p><textarea id="notes" placeholder="Enter notes here..."></textarea><div class="actions"><button type="button" onclick="showFinalResult()">View Final Result</button><button onclick="exportCleanPDF()">Download PDF</button><button onclick="clearForm()" class="secondary">Clear Fields</button></div><section id="finalreport" class="report-view" aria-live="polite"><h2>FINAL DAILY RESULT</h2><p class="report-subtitle">Combined totals only. Detailed entries remain above for editing.</p><div id="reportcontents"></div></section></main><script>
const A=[['tax1','Taxable Sales 1'],['tax2','Taxable Sales 2'],['ice1','ICEBAG 1'],['ice2','ICEBAG 2'],['non1','NON TAX 1'],['non2','NON TAX 2'],['pills1','Pills 1'],['pills2','Pills 2'],['salestax1','Sales Tax 1'],['salestax2','Sales Tax 2'],['atm1','ATM Fee 1'],['atm2','ATM Fee 2'],['lottery','Lottery'],['lucky','Lucky Game'],['lotto','Lotto Sales']];
const B=[['cc1','Credit Card 1'],['cc2','Credit Card 2'],['altri1','Altri 1'],['altri2','Altri 2'],['loyal1','Loyal 1'],['loyal2','Loyal 2'],['alpvd1','ALPVD 1'],['alpvd2','ALPVD 2'],['shop1','Shop Expenses 1'],['grocery','Grocery Expense'],['drawcash','Draw Game Cashes'],['scratchcash','Scratch Cashes'],['drawcredit','Draw Game Credit'],['match1','Match 1'],['match2','Match 2'],['cash','Sale Cash Balance']];
const lotteryPayout=['drawcash','scratchcash','drawcredit'];const adjustmentIds=['gameextra','peopletabs','backadded','otherowe'];const nonTax=['ice1','ice2','non1','non2','pills1','pills2'];const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);const val=id=>Number(document.getElementById(id)?.value)||0;const total=ids=>ids.reduce((sum,id)=>sum+val(id),0);
function row(id,label){return `<tr><td>${label}</td><td><input id="${id}" type="number" inputmode="decimal" step="0.01" placeholder="0.00" aria-label="${label}"></td></tr>`}
let aHTML=row(...A[0])+row(...A[1])+`<tr class="group"><td colspan="2">Non-Tax Sales</td></tr>`+A.slice(2,8).map(x=>row(...x)).join('')+`<tr class="subtotal"><td>Non-Tax Total</td><td><output id="nontax">$0.00</output></td></tr>`+A.slice(8).map(x=>row(...x)).join('')+`<tr class="total"><td>(A) Total</td><td><output id="atotal">$0.00</output></td></tr>`;
document.getElementById('a').innerHTML=aHTML;document.getElementById('b').innerHTML=B.map(x=>lotteryPayout.includes(x[0])&&x[0]==='drawcash'?'<tr class="group"><td colspan="2">Lottery Payout</td></tr>'+row(...x):row(...x)).join('').replace(row('drawcredit','Draw Game Credit'),row('drawcredit','Draw Game Credit')+'<tr class="subtotal"><td>Lottery Payout Total</td><td><output id="lotterysubtotal">$0.00</output></td></tr>')+`<tr class="total"><td>(B) Total</td><td><output id="btotal">$0.00</output></td></tr>`;
function showBalance(id,amount){const el=document.getElementById(id);el.replaceChildren();const money=document.createElement('span');money.className='amount-line';money.textContent=(amount>0?'+':'')+fmt(amount);const status=document.createElement('span');status.className='state-label';status.textContent=amount<0?'SHORT':amount>0?'OVER':'BALANCED';el.classList.toggle('short',amount<0);el.classList.toggle('over',amount>0);el.classList.toggle('good',amount===0);el.append(money,status)}
function calc(){let a=total(A.map(x=>x[0])),b=total(B.map(x=>x[0]));document.getElementById('nontax').textContent=fmt(total(nonTax));document.getElementById('lotterysubtotal').textContent=fmt(total(lotteryPayout));document.getElementById('atotal').textContent=fmt(a);document.getElementById('btotal').textContent=fmt(b);document.getElementById('sales').textContent=fmt(total(['tax1','tax2',...nonTax,'atm1','atm2']));const diff=Math.round((b-a)*100)/100;showBalance('difference',diff);const extras=Math.round(total(adjustmentIds)*100)/100;const final=Math.round((diff+extras-val('backtaken'))*100)/100;showBalance('finaldifference',final);}
// Combined report rows appear only in the final result and downloaded PDF.
const REPORT_A=[
  ['Taxable Sales',['tax1','tax2']],
  ['Non-Tax Sales',['ice1','ice2','non1','non2','pills1','pills2']],
  ['Sales Tax',['salestax1','salestax2']],
  ['ATM Fee',['atm1','atm2']],
  ['Lottery',['lottery']],
  ['Lucky Game',['lucky']],
  ['Lotto Sales',['lotto']]
];
const REPORT_B=[
  ['Credit Cards',['cc1','cc2','altri1','altri2','loyal1','loyal2','alpvd1','alpvd2']],
  ['Shop Expenses',['shop1']],
  ['Grocery Expense',['grocery']],
  ['Lottery Payout',['drawcash','scratchcash','drawcredit']],
  ['Match',['match1','match2']],
  ['Sale Cash Balance',['cash']]
];
const REPORT_EXTRAS=[
  ['Game Money Added Extra',['gameextra']],
  ['People Tabs',['peopletabs']],
  ['Money Taken From Back',['backtaken']],
  ['Money Added to Back',['backadded']],
  ['Other Money Owe',['otherowe']]
];
function finalBalanceText(id){
  const el=document.getElementById(id);
  return (el.querySelector('.amount-line')?.textContent||'')+' '+(el.querySelector('.state-label')?.textContent||'');
}
function reportTable(rows,totalLabel,totalValue){
  return '<table>'+rows.map(([name,ids])=>'<tr><td>'+name+'</td><td><output>'+fmt(total(ids))+'</output></td></tr>').join('')+
    (totalLabel?'<tr class="total"><td>'+totalLabel+'</td><td><output>'+totalValue+'</output></td></tr>':'')+'</table>';
}
function showFinalResult(){
  calc();
  const report=document.getElementById('finalreport');
  const d=document.getElementById('date').value;
  const day=document.getElementById('day').value;
  document.getElementById('reportcontents').innerHTML=
    '<p><strong>Date:</strong> '+d+' &nbsp; <strong>Day:</strong> '+day+'</p>'+ 
    '<h2>SECTION A</h2>'+reportTable(REPORT_A,'(A) Total',document.getElementById('atotal').textContent)+
    '<h2>SECTION B</h2>'+reportTable(REPORT_B,'(B) Total',document.getElementById('btotal').textContent)+
    '<h2>DAILY SUMMARY</h2>'+reportTable(REPORT_EXTRAS,null,null)+
    '<table><tr class="total"><td>Total Daily Sales</td><td><output>'+document.getElementById('sales').textContent+'</output></td></tr>'+ 
    '<tr class="total"><td>OVER / SHORT (C)</td><td><output>'+finalBalanceText('difference')+'</output></td></tr>'+ 
    '<tr class="total"><td>FINAL OVER / SHORT</td><td><output>'+finalBalanceText('finaldifference')+'</output></td></tr></table>'+ 
    (document.getElementById('notes').value.trim()?'<p><strong>Notes:</strong> '+document.getElementById('notes').value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</p>':'');
  report.classList.add('active');
  report.scrollIntoView({behavior:'smooth',block:'start'});
}
function updateDay(){const d=document.getElementById('date').value;document.getElementById('day').value=d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long'}):''}function clearForm(){if(!confirm('Clear all entered amounts and notes?'))return;document.querySelectorAll('table input[type=number]').forEach(x=>x.value='');document.getElementById('notes').value='';calc()}
document.querySelectorAll('table input[type=number]').forEach(x=>x.addEventListener('input',calc));document.getElementById('date').addEventListener('change',updateDay);let now=new Date();document.getElementById('date').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;updateDay();calc();
</script>
<script>
// Generates a self-contained PDF without external scripts or browser print headers.
function exportCleanPDF() {
  try {
    calc();
    const pages=[];
    let commands=[], y=46;
    const W=612,H=792,L=39,R=573,tableW=R-L,rowH=19;
    const esc=t=>String(t??'').replace(/[^\x20-\x7E]/g,c=>c==='\u2212'?'-':' ').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
    const text=(t,x,yy,size=10,bold=false,align='left')=>{
      let str=esc(t);
      if(align==='right') x-=str.length*size*(bold?0.53:0.49);
      if(align==='center') x-=str.length*size*0.27;
      commands.push(`BT /${bold?'F2':'F1'} ${size} Tf 0.08 0.12 0.08 rg 1 0 0 1 ${x.toFixed(2)} ${(H-yy).toFixed(2)} Tm (${str}) Tj ET`);
    };
    const box=(x,top,w,h,color)=>{
      commands.push(`${color.join(' ')} rg 0.15 0.22 0.15 RG 0.7 w ${x} ${H-top-h} ${w} ${h} re B`);
    };
    const savePage=()=>{pages.push(commands.join('\n'));commands=[];y=46;};
    const next=(h)=>{if(y+h>H-42)savePage();};
    const header=(name)=>{next(31);box(L,y,tableW,25,[0.67,0.80,0.57]);text(name,306,y+16,12,true,'center');y+=25;};
    const line=(label,value,style='')=>{
      next(rowH);
      const leftColor=style==='total'?[0.67,0.80,0.57]:style==='subtotal'?[0.90,0.95,0.85]:style==='group'?[0.95,0.87,0.64]:[1,0.95,0.79];
      box(L,y,tableW*0.62,rowH,leftColor);
      box(L+tableW*0.62,y,tableW*0.38,rowH,[1,1,1]);
      const name=label.length>36?label.slice(0,35):label;
      text(name,L+8,y+13,style==='group'?9:9.7,style==='total'||style==='subtotal'||style==='group');
      if(value!==null&&value!==undefined)text(value,R-8,y+13,9.7,style==='total', 'right');
      y+=rowH;
    };
    const money=id=>fmt(val(id));
    const subtotal=ids=>fmt(total(ids));
    text('Daily Sheet',306,30,16,true,'center');
    line('Date',document.getElementById('date').value||'');
    line('Day',document.getElementById('day').value||'');
    y+=14;
    header('SECTION A');
    REPORT_A.forEach(([label,ids])=>line(label,subtotal(ids)));
    line('(A) Total',subtotal(A.map(x=>x[0])),'total');
    y+=16;
    header('SECTION B');
    REPORT_B.forEach(([label,ids])=>line(label,subtotal(ids)));
    line('(B) Total',subtotal(B.map(x=>x[0])),'total');
    y+=16;
    header('DAILY SUMMARY');
    const result=id=>finalBalanceText(id).trim();
    line('Total Daily Sales',document.getElementById('sales').textContent,'total');
    line('OVER / SHORT (C)',result('difference'),'total');
    REPORT_EXTRAS.forEach(([label,ids])=>line(label,subtotal(ids)));
    line('FINAL OVER / SHORT',result('finaldifference'),'total');
    const notes=document.getElementById('notes').value.trim();
    if(notes){
      y+=15;next(30);text('Notes:',L,y,10,true);y+=17;
      const chunks=notes.split(/\n/).flatMap(row=>{
        const words=row.split(/\s+/),lines=[];let current='';
        for(const word of words){if((current+' '+word).length>92){lines.push(current);current=word;}else current=current?current+' '+word:word;}
        if(current)lines.push(current);return lines;
      });
      chunks.forEach(ln=>{next(13);text(ln,L,y,9);y+=13;});
    }
    savePage();
    // Build a standards-compliant PDF with bundled Helvetica font references.
    const objects=[null];
    const obj=value=>{objects.push(value);return objects.length-1;};
    const catalogId=obj('');const pagesId=obj('');
    const font1=obj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
    const font2=obj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
    const pageIds=[];
    pages.forEach(content=>{
      const streamId=obj(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
      pageIds.push(obj(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> >> /Contents ${streamId} 0 R >>`));
    });
    objects[pagesId]=`<< /Type /Pages /Kids [${pageIds.map(n=>n+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    objects[catalogId]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
    let pdf='%PDF-1.4\n%SGFM\n',offsets=[0];
    for(let i=1;i<objects.length;i++){
      offsets[i]=pdf.length;
      pdf+=`${i} 0 obj\n${objects[i]}\nendobj\n`;
    }
    const xref=pdf.length;
    pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;
    for(let i=1;i<objects.length;i++)pdf+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;
    pdf+=`trailer\n<< /Size ${objects.length} /Root ${catalogId} 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const blob=new Blob([pdf],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='SGFM_Daily_Sheet_'+(document.getElementById('date').value||'report')+'.pdf';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  } catch(err){
    console.error('SGFM PDF error',err);
    alert('PDF could not be created. Please send me a screenshot of this message: '+err.message);
  }
}
</script></body></html>
