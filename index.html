<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGFM Daily Sheet</title><style>body{font-family:Arial,sans-serif;background:#f5f6f3;margin:0;padding:16px;color:#111}.wrap{max-width:680px;margin:auto;background:white;padding:18px;border-radius:10px;box-shadow:0 2px 12px #0001}h1{text-align:center;font-size:24px}h2{background:#a9cd91;font-size:19px;font-weight:500;text-align:center;padding:9px;margin:25px 0 0;border:2px solid #222;border-bottom:0}.date{display:grid;grid-template-columns:1fr 1fr;gap:12px}.date label{background:#a9cd91;padding:8px;border:1px solid #222}.date input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:9px;font-size:16px;background:white;border:1px solid #777}table{width:100%;border-collapse:collapse}td{border:2px solid #222;padding:0}td:first-child{background:#fff1c9;width:58%;padding:8px 5px;font-size:17px}td:last-child{width:42%}td input{width:100%;box-sizing:border-box;padding:9px 7px;border:0;font-size:17px;text-align:right;background:white}tr.total td{background:#fff1c9;font-weight:bold}tr.total td:last-child{background:#fff}output{display:block;text-align:right;padding:9px 8px;font-size:18px}.summary{margin-top:25px}.summary td:first-child{background:#a9cd91;font-weight:bold}textarea{width:100%;box-sizing:border-box;min-height:85px;padding:10px;font-size:16px}button{padding:12px 18px;background:#2e6c38;color:white;border:0;border-radius:7px;font-size:16px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}button.secondary{background:#555}small{display:block;color:#555;margin-top:12px}@media(max-width:440px){td:first-child{font-size:15px}h2{font-size:17px}.wrap{padding:10px}}</style></head><body><main class="wrap"><h1>SGFM Daily Sheet</h1><div class="date"><label>Date<input type="date" id="date"></label><label>Day<input id="day" readonly></label></div><h2>(A) CASH IN STORE REVENUE</h2><table id="a"></table><h2>(B) ITEMS THAT REDUCE CASH</h2><table id="b"></table><table class="summary"><tr><td>Total Daily Sales</td><td><output id="sales">$0.00</output></td></tr><tr><td>(A - B = C) OVER/SHORT</td><td><output id="difference">$0.00</output></td></tr></table><p><b><u>Notes:</u></b></p><textarea id="notes" placeholder="Enter notes here..."></textarea><div class="actions"><button onclick="save()">Save This Day</button><button onclick="window.print()" class="secondary">Print / PDF</button><button onclick="clearForm()" class="secondary">Clear</button></div><small>Saved entries are stored only in this browser on this device. Select a date to load that day's saved entry.</small></main><script>const A=['Taxable Sale','Non-Taxable Sales','Sales Tax','ATM Fee','Lottery','Game Pads','Lotto Sales'];const B=['Credit Card','EBT','Shop Expenses','Grocery Invoices','Lotto/Lottery Paid Out','Match','Sale Cash Balance (SCB)'];const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);function build(id,labels){document.getElementById(id).innerHTML=labels.map((x,i)=>`<tr><td>${x}</td><td><input type="number" step="0.01" inputmode="decimal" id="${id}${i}" placeholder="0.00" oninput="calc()"></td></tr>`).join('')+`<tr class="total"><td>(${id.toUpperCase()}) Total:</td><td><output id="${id}total">$0.00</output></td></tr>`}build('a',A);build('b',B);function calc(){let sum=id=>Array.from(document.querySelectorAll(`#${id} input`)).reduce((s,x)=>s+(Number(x.value)||0),0);let a=sum('a'),b=sum('b');document.getElementById('atotal').textContent=money(a);document.getElementById('btotal').textContent=money(b);document.getElementById('sales').textContent=money((Number(document.getElementById('a0').value)||0)+(Number(document.getElementById('a1').value)||0));document.getElementById('difference').textContent=money(a-b)}function key(){return 'sgfm-day-'+document.getElementById('date').value}function save(){if(!document.getElementById('date').value){alert('Choose a date first');return}let data={a:A.map((_,i)=>document.getElementById('a'+i).value),b:B.map((_,i)=>document.getElementById('b'+i).value),notes:document.getElementById('notes').value};localStorage.setItem(key(),JSON.stringify(data));alert('Saved on this device')}function load(){let v=document.getElementById('date').value;document.getElementById('day').value=v?new Date(v+'T12:00:00').toLocaleDateString('en-US',{weekday:'long'}):'';let data=JSON.parse(localStorage.getItem(key())||'{}');['a','b'].forEach(id=>(id==='a'?A:B).forEach((_,i)=>document.getElementById(id+i).value=data[id]?.[i]||''));document.getElementById('notes').value=data.notes||'';calc()}function clearForm(){if(!confirm('Clear fields for this date? Saved data will remain until you save again.'))return;['a','b'].forEach(id=>(id==='a'?A:B).forEach((_,i)=>document.getElementById(id+i).value=''));document.getElementById('notes').value='';calc()}document.getElementById('date').addEventListener('change',load);document.getElementById('date').value=new Date().toLocaleDateString('en-CA');load();</script></body></html>
